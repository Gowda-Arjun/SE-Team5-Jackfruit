services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: hms
      POSTGRES_USER: hms
      POSTGRES_PASSWORD: hms
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  web:
    build: .
    env_file: .env
    ports: ["8000:8000"]
    volumes: [".:/app"]
    depends_on: [db]
volumes:
  pgdata:
