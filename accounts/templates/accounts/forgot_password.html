{% extends "base.html" %}
{% block content %}
<h2>Forgot password</h2>
{% if message %}<p>{{ message }}</p>{% endif %}
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Send OTP</button>
</form>
<p><a href="{% url 'accounts:reset_password' %}">I have an OTP</a></p>
{% endblock %}
