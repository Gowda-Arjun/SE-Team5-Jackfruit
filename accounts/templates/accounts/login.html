{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-12 col-sm-8 col-md-5">
    <h1 class="h3 mb-3">Log in</h1>
    <form method="post" novalidate>
      {% csrf_token %}
      {% if form.non_field_errors %}<div class="alert alert-danger" role="alert">{{ form.non_field_errors|join:" " }}</div>{% endif %}
      <div class="mb-3">
        <label class="form-label" for="id_username">Username</label>
        <input class="form-control" type="text" name="username" id="id_username" required autofocus>
      </div>
      <div class="mb-3">
        <label class="form-label" for="id_password">Password</label>
        <input class="form-control" type="password" name="password" id="id_password" required>
      </div>
      <button class="btn btn-primary w-100" type="submit">Log in</button>
    </form>
  </div>
</div>
{% endblock %}
