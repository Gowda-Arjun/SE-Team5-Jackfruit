# Runs on every push and pull request: lint + full test suite against PostgreSQL 15
# (SAD ADR-03: PostgreSQL in every environment, including CI).
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: hms
          POSTGRES_USER: hms
          POSTGRES_PASSWORD: hms
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U hms"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      POSTGRES_DB: hms
      POSTGRES_USER: hms
      POSTGRES_PASSWORD: hms
      POSTGRES_HOST: localhost
      DJANGO_SECRET_KEY: ci-only-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Lint (flake8)
        run: flake8
      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run
      - name: Django system check
        run: python manage.py check
      - name: Tests (pytest)
        run: pytest
