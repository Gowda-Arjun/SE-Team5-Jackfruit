# PR hygiene: every PR must link the backlog issue it implements ("Closes #12"),
# and gets an auto-label for the module(s) it touches.
name: PR checks

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: write
  issues: write
  contents: read

jobs:
  linked-issue:
    runs-on: ubuntu-latest
    steps:
      - name: Require a linked issue
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.pull_request.body || "";
            if (!/(close[sd]?|fix(e[sd])?|resolve[sd]?)\s+#\d+/i.test(body)) {
              core.setFailed('PR description must link its backlog issue, e.g. "Closes #12".');
            }
  module-label:
    runs-on: ubuntu-latest
    steps:
      - name: Label PR by module
        uses: actions/github-script@v7
        with:
          script: |
            const map = { accounts: "module:auth", allocation: "module:allocation", fees: "module:fees",
                          complaints: "module:complaints", reports: "module:reports", audit: "module:audit",
                          ".github": "module:infra", config: "module:infra", core: "module:infra" };
            const files = await github.paginate(github.rest.pulls.listFiles,
              { ...context.repo, pull_number: context.payload.pull_request.number });
            const labels = [...new Set(files.map(f => map[f.filename.split("/")[0]]).filter(Boolean))];
            if (labels.length) {
              await github.rest.issues.addLabels({ ...context.repo,
                issue_number: context.payload.pull_request.number, labels });
            }
